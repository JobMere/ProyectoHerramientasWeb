<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barberías — BarberHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
<link href="barberias.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-bh">
  <div class="container">
    <a class="navbar-brand brand-name d-flex align-items-center gap-2" href="index.html">
      <i class="bi bi-scissors text-warning" style="color:var(--bh-gold)!important;"></i>
      BARBER<span>HUB</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="border-color:#ffffff40;">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="barberias.html">Barberías</a></li>
        <li class="nav-item"><a class="nav-link" href="nosotros.html">Sobre nosotros</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-cream btn-sm px-3" type="button">Iniciar sesión</button>
        <button class="btn btn-gold btn-sm px-3" type="button">Registrarse</button>
      </div>
    </div>
  </div>
</nav>

<!-- CABECERA + FILTROS -->
<section class="page-header">
  <div class="container position-relative">
    <h1>Todas las <span class="accent">barberías</span></h1>
    <p class="lead mb-4">Compara servicios, precios y ubicación para elegir la barbería ideal.</p>

    <form id="filtrosForm" class="search-card d-flex flex-column flex-md-row align-items-stretch">
      <div class="d-flex align-items-center px-3 py-2 flex-grow-1">
        <i class="bi bi-geo-alt me-2 text-secondary"></i>
        <select id="filtroZona" class="form-select form-select-sm">
          <option value="">Todas las zonas</option>
        </select>
      </div>
      <div class="divider d-none d-md-block my-2"></div>
      <div class="d-flex align-items-center px-3 py-2 flex-grow-1">
        <i class="bi bi-scissors me-2 text-secondary"></i>
        <select id="filtroServicio" class="form-select form-select-sm">
          <option value="">Todos los servicios</option>
        </select>
      </div>
      <button type="submit" class="btn btn-gold d-flex align-items-center justify-content-center gap-2 px-4 m-2">
        <i class="bi bi-search"></i> Buscar
      </button>
    </form>
  </div>
</section>

<!-- LISTADO -->
<section class="section-featured">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <p id="contador" class="text-secondary mb-0">Cargando…</p>
      <button id="limpiarFiltros" class="btn-outline-dark-pill" type="button">
        <i class="bi bi-x-circle me-1"></i> Limpiar filtros
      </button>
    </div>

    <div id="estado" class="estado-msg d-none"></div>
    <div id="listaBarberias" class="row g-4"></div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="container d-flex flex-column flex-lg-row justify-content-between align-items-center gap-3">
    <a class="brand-name d-flex align-items-center gap-2 text-white" href="index.html">
      <i class="bi bi-scissors" style="color:var(--bh-gold);"></i>
      BARBER<span style="color:var(--bh-gold);">HUB</span>
    </a>
    <small class="text-secondary">© 2026 BarberHub. Todos los derechos reservados.</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
<script src="barberias.js"></script>
</body>
</html>
